name: VS Code extension

# Pull requests: build, test and package the extension (the .vsix is kept as an artifact).
# Tags `vscode-v*` (from scripts/vscode-release.sh): also publish the release.
on:
  pull_request:
    paths: ["src/**", "public/wasm/**", "vscode-extension/**", "package.json", "package-lock.json", ".github/workflows/vscode-extension.yml"]
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: publishing steps are skipped when a token is not configured.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and run the extension in VS Code
        run: xvfb-run -a npm run vscode:test
      - name: Package
        run: npm run vscode:package
      - name: Check tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          v=$(node -p "require('./vscode-extension/package.json').version")
          [ "vscode-v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: md2slides-vsix
          path: vscode-extension/*.vsix

      - name: Publish to the VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v') && env.VSCE_PAT != ''
        run: cd vscode-extension && npx vsce publish --packagePath *.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/vscode-v') && env.OVSX_PAT != ''
        run: cd vscode-extension && npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
      - name: GitHub release with the .vsix
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/*.vsix
          generate_release_notes: true
