[package]
name = "slide-engine"
version = "0.1.0"
edition = "2021"
description = "Slidewise core: Markdown deck parser, template store and slot renderer compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
